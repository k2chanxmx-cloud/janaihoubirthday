<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff7eb6">
  <title>じゃない方 生誕AIメーカー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="confetti" aria-hidden="true">🎀　✨　🎉　💛　🎂　🩵　🎈　✨</div>
  <main class="app-shell">
    <header class="hero">
      <div class="cake">🎂</div>
      <p class="eyebrow">HAPPY BIRTHDAY 2026</p>
      <h1>じゃない方<br><span>生誕AIメーカー</span></h1>
      <p>写真を選んで、AIに好きなことをさせよう！</p>
    </header>

    <section class="panel">
      <h2><span>1</span> 写真を選ぶ</h2>
      <div class="photo-grid" id="photoGrid">
        <button class="photo-card" data-photo="photo1.jpg" aria-label="かわいい写真1">
          <span class="category">💖 かわいい</span><img src="{{ url_for('static', filename='photos/photo1.jpg') }}" alt="かわいい写真1"><span class="selected-badge">✓ 選択中</span>
        </button>
        <button class="photo-card" data-photo="photo2.jpg" aria-label="かわいい写真2">
          <span class="category">💖 かわいい</span><img src="{{ url_for('static', filename='photos/photo2.jpg') }}" alt="かわいい写真2"><span class="selected-badge">✓ 選択中</span>
        </button>
        <button class="photo-card" data-photo="photo3.jpg" aria-label="変顔写真1">
          <span class="category">🤣 変顔</span><img src="{{ url_for('static', filename='photos/photo3.jpg') }}" alt="変顔写真1"><span class="selected-badge">✓ 選択中</span>
        </button>
        <button class="photo-card" data-photo="photo4.jpg" aria-label="変顔写真2">
          <span class="category">🤣 変顔</span><img src="{{ url_for('static', filename='photos/photo4.jpg') }}" alt="変顔写真2"><span class="selected-badge">✓ 選択中</span>
        </button>
      </div>
    </section>

    <section class="panel">
      <h2><span>2</span> 何をさせたい？</h2>
      <textarea id="prompt" maxlength="200" placeholder="例：魔法少女になって、巨大な誕生日ケーキに乗って！"></textarea>
      <div class="prompt-footer"><span>「猫」「神」「ラスボス」「ケーキ」で隠し演出も…？</span><b id="counter">0/200</b></div>
      <button id="generateBtn" class="primary" disabled>✨ この写真でAI生成する！ ✨</button>
      <p class="limit-note">生成は1端末 {{ per_ip_limit }} 回まで</p>
    </section>

    <section id="loading" class="panel loading" hidden>
      <div class="bouncing-cake">🎂</div><h2>じゃない方がお祝い中…</h2><p>画像を生成しています</p><div class="dots"><i></i><i></i><i></i></div>
    </section>

    <section id="result" class="panel result" hidden>
      <p class="eyebrow">＼ できました！ ／</p><h2>✨ 完成！！ ✨</h2>
      <img id="resultImage" alt="AIで生成した生誕画像">
      <div class="actions">
        <button id="shareBtn" class="x-button">𝕏 で投稿する</button>
        <a id="downloadBtn" class="secondary" download="janaihou_birthday_2026.jpg">画像を保存</a>
        <button id="copyBtn" class="secondary">投稿文をコピー</button>
      </div>
      <button id="retryBtn" class="text-button">別の画像もつくる</button>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
    <footer>#じゃない方生誕 🎂 Birthday 2026</footer>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
